<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opheliadex</title>
  <style>
    :root { --bg:#f7f7f5; --fg:#1a1a1a; --muted:#666; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; } }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { min-height:100%; display:grid; place-content:center; text-align:center; padding:16px; }
    h1 { font-size:clamp(2rem,8vw,4rem); margin:0 0 .25em; letter-spacing:-.02em; }
    p { color:var(--muted); margin:0; }
  </style>
</head>
<body>
  <main>
    <h1>Opheliadex</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
